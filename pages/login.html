<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../stylesheet/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="logo">
            <img src="../images/LOGO.png" alt="databaseLogo">
        </div>

        <div class="login-container">
            <h1>Welcome Back!</h1>
            <p>Track attendance. Support students. Make every day count.</p>

            <form id="loginForm" action="../php/login.php" method="POST">
                <label for="username">Username</label>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <label for="password">Password</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="login-options">
                    <div class="rememberMe-container">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe" class="rememberMe-text">Remember Me?</label>
                    </div>
                    <a href="#">Forgot Password?</a>
                </div>

                <p id="errorMessage" class="error-message"></p>
                <button type="submit">Login</button>
            </form>

            <img src="../images/schoolLogo.png" alt="schoolLogo">
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
